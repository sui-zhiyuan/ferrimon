[package]
name = "ferrimon-web"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ferrimon-web"
path = "src/main.rs"

[dependencies]
ferrimon-common = { path = "../common" }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"